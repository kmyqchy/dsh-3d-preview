name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and attach tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The asset name is deliberately version-free: the documented install
      # command is releases/latest/download/dsh-3d-preview.tgz, and
      # `latest/download/<name>` takes the filename literally, so a versioned
      # asset would 404 on the next release.
      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          mv dist/dsh-3d-preview-*.tgz dist/dsh-3d-preview.tgz
          tar -tzf dist/dsh-3d-preview.tgz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/dsh-3d-preview.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
