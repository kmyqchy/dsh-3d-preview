name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build / typecheck / test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ignore-scripts: dsh-better-sidebar (types only) pulls node-pty, whose
      # native build is unrelated to anything here.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The client bundle is committed so that a git install needs no build.
      # A silently-stale artifact is the one failure that would ship to users,
      # so prove the committed file is the one the sources produce.
      - name: Committed client bundle is up to date
        run: git diff --exit-code --stat -- lib/

      - name: Packed artifact contains both halves
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack
          tar -tzf /tmp/pack/dsh-3d-preview-*.tgz | sort > /tmp/pack/contents.txt
          cat /tmp/pack/contents.txt
          grep -q 'package/lib/index.js' /tmp/pack/contents.txt
          grep -q 'package/lib/client.js' /tmp/pack/contents.txt
          grep -q 'package/cordis.patch.yml' /tmp/pack/contents.txt
